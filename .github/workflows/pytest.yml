name: pytest
on:
  # Note: Do not filter by `paths:` at the workflow trigger (`on.pull_request`)
  # level. Because `pytest` jobs are required status checks in repository
  # settings, skipping the entire workflow leaves required checks in the
  # "Expected — Waiting for status to be reported" state and blocks merging
  # non-code PRs (such as website updates). Previously, `pull_request_review`
  # was used as a workaround to trigger `pytest` upon approval, which caused
  # the full test suite to run on website-only PRs.
  #
  # Instead, we trigger the workflow on all `pull_request` and `merge_group`
  # events and use the fast `check-changes` job below to conditionally skip the
  # test jobs via `if:`. GitHub treats jobs skipped via `if:` as passing
  # required status checks.
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: 0 5 * * 1 # Every Monday at 5:00 UTC
  merge_group:  # Needed for required workflows

jobs:
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Full history is needed to diff against origin/main.
          fetch-depth: 0
      - name: Check for Python or Rust changes
        id: filter
        shell: bash
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only origin/main...HEAD | grep -E '(\.py$|\.rs$|^pyproject\.toml$|^requirements\.txt$|^pytest\.ini$|^rust/Cargo\.(toml|lock)$|^\.github/workflows/pytest\.yml$)'; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

  unittesting:
    needs: check-changes
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        # ubuntu-20.04-arm was not stable enough when testing
        platform:
          - runner: ubuntu-latest  # x64
          - runner: windows-latest  # x64
          - runner: macos-15  # arm64
          - runner: macos-15-intel  # Intel
          - runner: macos-latest  # arm64
    if: github.event_name != 'schedule' && needs.check-changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Get pip cache directory
        id: pip-cache
        shell: bash
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: Use cached venv or create it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ matrix.platform.runner }}-pip
      # Build a virtualenv, but only if it doesn't already exist
      - name: Populate pip cache
        # requirements.txt is not reliable since across different platforms and
        # their versions the pip package versions might vary. We regenerate it
        # again from pyproject.toml every time when pyproject.toml or
        # requirements.txt changes. The pinned versions in requirements.txt are
        # tested by coverage since that is running on ubuntu which is also used
        # to produce the main requirements.txt file.
        run: |
          pip install pip==25.2 # TODO(remove the pinning) pip-tools issue 2252
          pip install pip-tools
          pip-compile --generate-hashes --extra dev --extra tf pyproject.toml > dev_requirements.txt
          pip install -r dev_requirements.txt
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Save cache
        id: cache-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Install sedpack locally
        run: pip install --editable ".[dev,tf]"
      - name: Running unit tests
        run: python -m pytest

  unittesting_minimal:
    needs: check-changes
    runs-on: ${{ matrix.platform.runner }}
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        # ubuntu-20.04-arm was not stable enough when testing
        platform:
          - runner: ubuntu-latest  # x64
          - runner: windows-latest  # x64
          - runner: macos-15  # arm64
          - runner: macos-15-intel  # Intel
          - runner: macos-latest  # arm64
    if: github.event_name != 'schedule' && needs.check-changes.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Get pip cache directory
        id: pip-cache
        shell: bash
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: Use cached venv or create it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ matrix.platform.runner }}-pip-minimal
      # Build a virtualenv, but only if it doesn't already exist
      - name: Populate pip cache
        run: |
          pip install pip==25.2 # TODO(remove the pinning) pip-tools issue 2252
          pip install pip-tools
          pip-compile --generate-hashes pyproject.toml > min_requirements.txt
          pip install -r min_requirements.txt
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Save cache
        id: cache-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Install sedpack locally
        run: |
          pip install --editable .
          pip install pytest pytest-asyncio
      - name: Running unit tests
        run: python -m pytest

  coverage:
    needs: check-changes
    if: needs.check-changes.outputs.should_run == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Get pip cache directory
        id: pip-cache
        shell: bash
        run: |
          echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT
      - name: Use cached venv or create it
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        id: cache
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          # The cache key depends on requirements.txt
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
      # Build a virtualenv, but only if it doesn't already exist
      - name: Populate pip cache
        run: |
          python -m pip install --require-hashes --no-deps -r requirements.txt
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Save cache
        id: cache-save
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ steps.pip-cache.outputs.dir }}
          key: ${{ steps.cache.outputs.cache-primary-key }}
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Installing test requirements and sedpack
        # Start by "installing" sedpack to be sure all dependencies are listed
        run: |
          pip install --editable ".[dev,tf]"
          echo "PYTHONPATH=./src:$PYTHONPATH" >> $GITHUB_ENV
      - name: Install workflow dependencies
        run: pip install --upgrade pytest coverage
      - name: Running unit tests with coverage
        env:
          DISABLE_AUTOGRAPH: 1
        # TODO remove the -i (ignore errors)
        run: |
          coverage run -m pytest
          coverage xml -i
      - name: Upload results
        uses: coverallsapp/github-action@648a8eb78e6d50909eff900e4ec85cab4524a45b
        with:
          file: coverage.xml

